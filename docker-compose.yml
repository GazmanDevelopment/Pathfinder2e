services:
  sheet:
    build: .
    ports:
      # Host:container. Container side stays 8000 (matches Dockerfile/uvicorn);
      # only the host side needs to change if 8000 is already taken on the box.
      - "8101:8000"
    environment:
      DATABASE_URL: "sqlite:////data/sheet.db"
      UPLOAD_DIR: "/uploads"
      # Auth (Phase 2). Point the app at Authelia's OIDC endpoints and give it
      # a session signing secret. See authelia/ for the provider side, and
      # docs/truenas-setup.md for generating the secrets.
      SESSION_SECRET: "${SESSION_SECRET}"
      APP_BASE_URL: "https://pathfinder.huscroft.com.au"
      OIDC_AUTHELIA_ISSUER: "https://auth.pathfinder.huscroft.com.au"
      OIDC_AUTHELIA_CLIENT_ID: "${OIDC_AUTHELIA_CLIENT_ID}"
      OIDC_AUTHELIA_CLIENT_SECRET: "${OIDC_AUTHELIA_CLIENT_SECRET}"
      # Microsoft Entra (Phase 3). Leave unset to hide the "Sign in with
      # Microsoft" button. Issuer is tenant-specific, not "common".
      OIDC_ENTRA_ISSUER: "${OIDC_ENTRA_ISSUER}"       # https://login.microsoftonline.com/<tenant>/v2.0
      OIDC_ENTRA_CLIENT_ID: "${OIDC_ENTRA_CLIENT_ID}"
      OIDC_ENTRA_CLIENT_SECRET: "${OIDC_ENTRA_CLIENT_SECRET}"
    volumes:
      - ./data:/data
      - ./uploads:/uploads

  authelia:
    image: authelia/authelia:4.38
    volumes:
      - ./authelia:/config      # configuration.yml, users_database.yml, secrets, sqlite
    environment:
      TZ: "Australia/Sydney"
    ports:
      # Published, not just `expose`d: needed whenever the reverse proxy is
      # NOT itself a container in this compose project — e.g. a separate
      # device (a Synology/pfSense/OPNsense reverse proxy, or any proxy on a
      # different host) can only reach this over the network, not Docker's
      # internal bridge. If your proxy *is* a container alongside this one
      # (e.g. Traefik in the same compose file), `expose: ["9091"]` would be
      # enough — but `ports` also works for that case, so it's the safer
      # default here.
      - "9091:9091"
# The reverse proxy (Traefik/Caddy, or a separate-device proxy like Synology
# DSM's) fronts both services with TLS:
#   pathfinder.huscroft.com.au      -> <this-host-ip>:8101
#   auth.pathfinder.huscroft.com.au -> <this-host-ip>:9091
