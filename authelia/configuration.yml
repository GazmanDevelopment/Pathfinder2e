# Authelia configuration for the TrueNAS deployment.
#
# This file cannot be exercised on the dev machine (Authelia runs as a
# container and Docker isn't installed there); it is written to spec and must
# be verified on the box. Replace every remaining <PLACEHOLDER> (the client
# secret hash) and supply the secrets listed in docs/truenas-setup.md.
# Domain is pathfinder.huscroft.com.au, fronted by a Synology DSM reverse
# proxy — see docs/truenas-setup.md §4 for the reverse-proxy rules.

theme: light

server:
  address: "tcp://0.0.0.0:9091"

log:
  level: info

# Secrets come from files (mounted alongside this config) rather than inline,
# so they never live in the repo. See docs/truenas-setup.md.
identity_validation:
  reset_password:
    jwt_secret: "@/config/secrets/jwt_secret"

authentication_backend:
  file:
    path: /config/users_database.yml
    # Reload on file change instead of requiring a restart every time a
    # player is added or a password/entry is hand-edited. Default is false.
    watch: true
    password:
      algorithm: argon2
      argon2:
        variant: argon2id

# Cookie is scoped to the parent domain so it is valid for both the app and
# Authelia (they must live under the same parent domain).
session:
  secret: "@/config/secrets/session_secret"
  cookies:
    - domain: pathfinder.huscroft.com.au
      authelia_url: https://auth.pathfinder.huscroft.com.au
      default_redirection_url: https://pathfinder.huscroft.com.au

storage:
  encryption_key: "@/config/secrets/storage_encryption_key"
  local:
    path: /config/db.sqlite3

# SMTP via Mailjet — TOTP/WebAuthn registration and password-reset links need
# to actually reach players' inboxes, which the filesystem notifier (writes
# to a local file on the box) can't do.
#
# NOT SMTP2GO: SMTP2GO's server advertises SCRAM-SHA-256 in its EHLO
# capabilities, and Authelia's SMTP client (github.com/wneessen/go-mail)
# always prefers the strongest mechanism the server offers — SCRAM-SHA-256
# here — with no config option to make it prefer something else. That
# SCRAM attempt failed against SMTP2GO with "535 Incorrect authentication
# data" even with fully correct credentials (verified independently via a
# manual `curl` SMTP AUTH test, which succeeded — curl doesn't implement
# SCRAM at all, so it fell through to CRAM-MD5 and worked). Confirmed by
# reading Authelia's own source (internal/notification/smtp_auth.go), not
# assumed. NOT Brevo either — its free plan was dropped before this got
# deployed. Mailjet's server doesn't offer SCRAM at all (confirmed by
# probing its EHLO response directly), so Authelia falls through to a
# mechanism that actually works. See docs/truenas-setup.md §9 for the full
# story.
#
# Unlike SMTP2GO/Brevo (separate SMTP-specific credentials, distinct from
# their API keys), Mailjet's SMTP username IS its API key (public) and the
# SMTP password IS its Secret Key — both from the same API Keys page, no
# separate "SMTP user" to create. Only `password` documents @/path
# secret-file support in Authelia's own docs (confirmed before writing
# this — the earlier RSA key field silently treated an unsupported @/path
# as literal text, so this isn't assumed anymore); `username` goes here as
# plain text instead.
#
# Sender is on the root domain (huscroft.com.au), not pathfinder.huscroft.com.au
# — that subdomain is only web routing for the app, with no real mailbox to
# receive Mailjet's sender-verification email. Use a real, receivable M365
# mailbox address here, verified in Mailjet before this will deliver.
notifier:
  smtp:
    address: "submission://in-v3.mailjet.com:587"
    username: "<YOUR_MAILJET_API_KEY>"
    password: "@/config/secrets/smtp_password"
    sender: "Character Sheet <authelia@huscroft.com.au>"
    identifier: "huscroft.com.au"
    subject: "[Authelia] {title}"

# Require the second factor (TOTP) everywhere. Users enrol their authenticator
# on first login.
access_control:
  default_policy: two_factor

identity_providers:
  oidc:
    hmac_secret: "@/config/secrets/oidc_hmac_secret"
    # Unlike the secrets above, jwks[].key does NOT support the "@/path"
    # file-reference notation — it needs the raw PEM content inline, or
    # Authelia reads the literal string "@/..." as the key and fails with
    # "no PEM block was supplied or it was malformed". Paste the full
    # contents of secrets/oidc_issuer_private_key.pem below, every line
    # (including BEGIN/END) indented consistently under the `|`.
    jwks:
      - key: |
          <PASTE THE FULL CONTENTS OF secrets/oidc_issuer_private_key.pem HERE>
    clients:
      - client_id: pf2e-sheet
        client_name: "Character Sheet"
        # Hash of the client secret — generate with:
        #   authelia crypto hash generate pbkdf2 --variant sha512 --random ...
        client_secret: "<PBKDF2_HASH_OF_CLIENT_SECRET>"
        public: false
        authorization_policy: two_factor
        redirect_uris:
          - https://pathfinder.huscroft.com.au/auth/authelia/callback
        scopes:
          - openid
          - email
          - profile
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_post
