# Authelia configuration for the TrueNAS deployment.
#
# This file cannot be exercised on the dev machine (Authelia runs as a
# container and Docker isn't installed there); it is written to spec and must
# be verified on the box. Replace every remaining <PLACEHOLDER> (the client
# secret hash) and supply the secrets listed in docs/truenas-setup.md.
# Domain is pathfinder.huscroft.com.au, fronted by a Synology DSM reverse
# proxy — see docs/truenas-setup.md §4 for the reverse-proxy rules.

theme: light

server:
  address: "tcp://0.0.0.0:9091"

log:
  level: info

# Secrets come from files (mounted alongside this config) rather than inline,
# so they never live in the repo. See docs/truenas-setup.md.
identity_validation:
  reset_password:
    jwt_secret: "@/config/secrets/jwt_secret"

authentication_backend:
  file:
    path: /config/users_database.yml
    # Reload on file change instead of requiring a restart every time a
    # player is added or a password/entry is hand-edited. Default is false.
    watch: true
    password:
      algorithm: argon2
      argon2:
        variant: argon2id

# Cookie is scoped to the parent domain so it is valid for both the app and
# Authelia (they must live under the same parent domain).
session:
  secret: "@/config/secrets/session_secret"
  cookies:
    - domain: pathfinder.huscroft.com.au
      authelia_url: https://auth.pathfinder.huscroft.com.au
      default_redirection_url: https://pathfinder.huscroft.com.au

storage:
  encryption_key: "@/config/secrets/storage_encryption_key"
  local:
    path: /config/db.sqlite3

# SMTP via a dedicated Gmail account — TOTP/WebAuthn registration and
# password-reset links need to actually reach players' inboxes, which the
# filesystem notifier (writes to a local file on the box) can't do.
#
# NOT SMTP2GO/Brevo/Mailjet, all tried first (see docs/truenas-setup.md §9
# for the full story — three providers' worth of debugging before landing
# here). SMTP2GO's server advertises SCRAM-SHA-256, which this version of
# Authelia's SMTP client always prefers over anything else the server
# offers with no config override, and that specific SCRAM attempt failed
# with "535" despite fully correct credentials — confirmed by reading
# Authelia's own source, not assumed. Brevo's free plan was gone by the
# time this got deployed. Mailjet was the strangest: identical credentials
# succeeded via `curl` using three different AUTH mechanisms (PLAIN,
# CRAM-MD5, DIGEST-MD5), from the exact same Docker network Authelia runs
# on, over both STARTTLS and implicit TLS — yet Authelia's own client
# failed with "535" every time regardless, for reasons never conclusively
# identified even after tracing the exact pinned dependency versions
# (github.com/wneessen/go-mail v0.5.2) line by line. Gmail is what
# actually works, and is also the most field-tested SMTP+Authelia
# combination in the community.
#
# This is a dedicated Gmail account, NOT the M365 tenant used elsewhere in
# this project — SMTP AUTH is disabled tenant-wide on M365 by default and
# turning that off isn't a trade-off worth making for one automated app
# mailbox (see docs/truenas-setup.md §9). `username` is the full Gmail
# address; `password` is a Google **App Password** (Google Account →
# Security → App Passwords, needs 2-Step Verification enabled first), not
# the account's real login password. `sender` has to be that same Gmail
# address (or a "Send As" alias configured in Gmail) — Gmail's relay
# rejects an arbitrary From address the way a domain-verified provider
# would allow.
notifier:
  smtp:
    address: "submission://smtp.gmail.com:587"
    username: "<YOUR_GMAIL_ADDRESS>"
    password: "@/config/secrets/smtp_password"
    sender: "Character Sheet <YOUR_GMAIL_ADDRESS>"
    identifier: "huscroft.com.au"
    subject: "[Authelia] {title}"

# Require the second factor (TOTP) everywhere. Users enrol their authenticator
# on first login.
access_control:
  default_policy: two_factor

identity_providers:
  oidc:
    hmac_secret: "@/config/secrets/oidc_hmac_secret"
    # Unlike the secrets above, jwks[].key does NOT support the "@/path"
    # file-reference notation — it needs the raw PEM content inline, or
    # Authelia reads the literal string "@/..." as the key and fails with
    # "no PEM block was supplied or it was malformed". Paste the full
    # contents of secrets/oidc_issuer_private_key.pem below, every line
    # (including BEGIN/END) indented consistently under the `|`.
    jwks:
      - key: |
          <PASTE THE FULL CONTENTS OF secrets/oidc_issuer_private_key.pem HERE>
    clients:
      - client_id: pf2e-sheet
        client_name: "Character Sheet"
        # Hash of the client secret — generate with:
        #   authelia crypto hash generate pbkdf2 --variant sha512 --random ...
        client_secret: "<PBKDF2_HASH_OF_CLIENT_SECRET>"
        public: false
        authorization_policy: two_factor
        redirect_uris:
          - https://pathfinder.huscroft.com.au/auth/authelia/callback
        scopes:
          - openid
          - email
          - profile
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_post
