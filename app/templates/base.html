<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Character Sheet{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% set current_user = request.session.get("user") %}
  <nav class="site-nav">
    <a href="/characters">Characters</a>
    {% if current_user and current_user.role == "admin" %}
      <a href="/admin/users">Admin</a>
    {% endif %}
    {% if current_user %}
      <span class="nav-user">
        <span class="nav-user__name">{{ current_user.display_name or current_user.email }}</span>
        <form method="post" action="/logout" class="nav-logout">
          <button type="submit" class="btn btn--ghost">Log out</button>
        </form>
      </span>
    {% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
