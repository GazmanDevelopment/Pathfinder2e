<section id="core-stats" class="sheet-section sheet-section--edit">
  <h2>Core Statistics</h2>
  <form hx-put="/characters/{{ character.id }}/core-stats" hx-target="#core-stats" hx-swap="outerHTML" class="field-grid">
    <label>HP current <input type="number" name="hp_current" value="{{ character.hp_current if character.hp_current is not none else '' }}"></label>
    <label>HP max <input type="number" name="hp_max" value="{{ character.hp_max if character.hp_max is not none else '' }}"></label>
    <label>AC <input type="number" name="ac" value="{{ character.ac if character.ac is not none else '' }}"></label>
    <label>Class DC <input type="number" name="class_dc" value="{{ character.class_dc if character.class_dc is not none else '' }}"></label>
    <label>Spell DC <input type="number" name="spell_dc" value="{{ character.spell_dc if character.spell_dc is not none else '' }}"></label>
    <label>Spell Atk <input type="number" name="spell_atk" value="{{ character.spell_atk if character.spell_atk is not none else '' }}"></label>
    <label>Perception <input type="number" name="perception" value="{{ character.perception if character.perception is not none else '' }}"></label>
    <label>Hero Points <input type="number" name="hero_points" value="{{ character.hero_points if character.hero_points is not none else '' }}"></label>
    <div class="item-actions">
      <button type="submit" class="btn btn--primary">Save</button>
      <button type="button" class="btn btn--ghost" hx-get="/characters/{{ character.id }}/core-stats"
              hx-target="#core-stats" hx-swap="outerHTML">Cancel</button>
    </div>
  </form>
</section>
