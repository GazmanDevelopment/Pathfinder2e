<li id="{{ 'proficiency-row-' ~ prof.id if prof else 'proficiency-row-new' }}" class="item-row item-row--compact item-row--edit">
  <input type="text" name="name" value="{{ prof.name if prof else '' }}" placeholder="Skill or Save name" required>
  <span class="rank-field">
    <input type="text" name="rank" value="{{ prof.rank or '' if prof else '' }}" placeholder="Rank"
           class="rank-input" autocomplete="off">
    <div class="rank-suggestions" hidden>
      {% for option in ("Untrained", "Trained", "Expert", "Master", "Legendary") %}
        <button type="button" tabindex="-1">{{ option }}</button>
      {% endfor %}
    </div>
  </span>
  <input type="number" name="bonus" value="{{ prof.bonus if prof and prof.bonus is not none else '' }}" placeholder="Bonus">
  <span class="item-actions">
    {% if prof %}
      <button type="button" class="btn btn--primary" hx-put="/characters/{{ character_id }}/proficiencies/{{ prof.id }}"
              hx-include="closest li" hx-target="closest li" hx-swap="outerHTML">Save</button>
      <button type="button" class="btn btn--ghost" hx-get="/characters/{{ character_id }}/proficiencies/{{ prof.id }}"
              hx-target="closest li" hx-swap="outerHTML">Cancel</button>
    {% else %}
      <button type="button" class="btn btn--primary" hx-post="/characters/{{ character_id }}/proficiencies"
              hx-include="closest li" hx-target="closest li" hx-swap="outerHTML">Add</button>
      <button type="button" class="btn btn--ghost" hx-get="/characters/{{ character_id }}/proficiencies/add-trigger"
              hx-target="closest li" hx-swap="outerHTML">Cancel</button>
    {% endif %}
  </span>
  <script>
    (function () {
      // A native <input list=datalist> was tried here first, but browsers
      // filter the popup by the field's *current* value, and every seeded
      // skill/save starts pre-filled with "Untrained" — hiding every other
      // rank until the text was manually deleted. This small
      // self-contained dropdown avoids relying on that native, opaque,
      // hard-to-test behavior entirely — the five ranks always show, full
      // list, every time the field is focused.
      var li = document.currentScript.closest('li');
      var input = li.querySelector('.rank-input');
      var box = li.querySelector('.rank-suggestions');
      if (!input || !box) return;

      input.addEventListener('focus', function () {
        box.hidden = false;
      });
      input.addEventListener('click', function () {
        // Picking a suggestion (mousedown + preventDefault, below) never
        // actually blurs the input, so a second click on an already-
        // focused field fires no new 'focus' event to reopen the box.
        box.hidden = false;
      });
      input.addEventListener('blur', function () {
        box.hidden = true;
      });
      box.querySelectorAll('button').forEach(function (btn) {
        // mousedown + preventDefault, not click: stops the input from ever
        // blurring on the way to the click, so there's no race with the
        // blur handler above hiding the box first.
        btn.addEventListener('mousedown', function (event) {
          event.preventDefault();
          input.value = btn.textContent;
          box.hidden = true;
        });
      });
    })();
  </script>
</li>
