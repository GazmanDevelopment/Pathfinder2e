<li id="proficiency-row-{{ prof.id }}" class="item-row item-row--compact">
  <span class="item-field item-field--name">{{ prof.name }}</span>
  <span class="item-field">{{ prof.rank or "" }}</span>
  <span class="item-field">{{ prof.bonus if prof.bonus is not none else "" }}</span>
  <span class="item-actions">
    <button type="button" hx-get="/characters/{{ character_id }}/proficiencies/{{ prof.id }}/edit"
            hx-target="#proficiency-row-{{ prof.id }}" hx-swap="outerHTML">Edit</button>
    <button type="button" hx-delete="/characters/{{ character_id }}/proficiencies/{{ prof.id }}"
            hx-target="#proficiency-row-{{ prof.id }}" hx-swap="outerHTML"
            hx-confirm="Delete this proficiency?">Delete</button>
  </span>
</li>
